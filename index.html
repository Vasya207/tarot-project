<!DOCTYPE html>
<html lang="en-us">

<head>
<meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Ukrainian Night Tarot</title>

  <link rel="manifest" href="manifest.json?v=3">

  <meta name="theme-color" content="#000000">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ukrainian Night Tarot">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=6">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #unity-container {
      width: 100vw;
      height: 100vh;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Overlay when phone is vertical */
    #rotate-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      display: none;
      flex-direction: column;
      /* Змінено на column, щоб текст та іконка були один під одним */
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-size: 22px;
      /* Трохи зменшено, щоб гарантовано влазило на маленькі екрани */
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
      /* Виправляє обрізання тексту, враховуючи падінги всередині ширини */
      font-family: sans-serif;
    }

    /* Стилі для іконки телефону */
    .phone-icon {
      width: 40px;
      height: 70px;
      border: 3px solid white;
      border-radius: 6px;
      margin-top: 25px;
      /* Відступ під текстом */
      position: relative;
      animation: rotatePhone 2.5s ease-in-out infinite;
    }

    /* Кнопка "Home" або динамік на іконці телефону для реалістичності */
    .phone-icon::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border: 1px solid white;
      border-radius: 50%;
    }

    /* Анімація повороту екрана */
    @keyframes rotatePhone {

      0%,
      10% {
        transform: rotate(0deg);
      }

      40%,
      60% {
        transform: rotate(-90deg);
      }

      90%,
      100% {
        transform: rotate(0deg);
      }
    }

    /* ---- "Add to Home Screen" install hint (browser + mobile only) ---- */
    /* Hidden by default. JS adds .platform-ios / .platform-android to <html>
       when running in a mobile browser, and .standalone when already installed.
       Only the matching, not-installed variant is revealed. */
    .install-ios,
    .install-android {
      display: none;
    }

    html.platform-ios:not(.standalone) .install-ios,
    html.platform-android:not(.standalone) .install-android {
      display: flex;
    }

    .install-hint {
      margin-top: 40px;
      max-width: 320px;
    }

    .install-title {
      font-size: 16px;
      opacity: 0.85;
      margin-bottom: 14px;
    }

    .install-steps {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 15px;
    }

    /* iOS Safari "Share" icon: a box with an upward arrow rising out of it */
    .ios-share-icon {
      position: relative;
      display: inline-block;
      width: 18px;
      height: 22px;
      flex: 0 0 auto;
    }

    .ios-share-icon::before {
      /* box (open at the top) */
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 18px;
      height: 13px;
      border: 2px solid white;
      border-top: none;
      border-radius: 0 0 3px 3px;
      box-sizing: border-box;
    }

    .ios-share-icon::after {
      /* arrow shaft */
      content: '';
      position: absolute;
      top: 1px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 13px;
      background: white;
    }

    .ios-share-icon .arrow-head {
      /* arrow head (chevron) */
      position: absolute;
      top: 1px;
      left: 50%;
      width: 8px;
      height: 8px;
      border-left: 2px solid white;
      border-top: 2px solid white;
      transform: translateX(-50%) rotate(45deg);
      transform-origin: center;
    }

    /* Android "more options" icon: three vertical dots (⋮) */
    .android-menu-icon {
      position: relative;
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 -6px 0 white, 0 6px 0 white;
      margin: 6px 4px;
      flex: 0 0 auto;
    }

    /* "Add to Home Screen" icon: rounded square with a plus inside */
    .add-home-icon {
      position: relative;
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid white;
      border-radius: 4px;
      box-sizing: border-box;
      flex: 0 0 auto;
    }

    .add-home-icon::before,
    .add-home-icon::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      background: white;
    }

    .add-home-icon::before {
      /* horizontal bar of the plus */
      width: 8px;
      height: 2px;
      transform: translate(-50%, -50%);
    }

    .add-home-icon::after {
      /* vertical bar of the plus */
      width: 2px;
      height: 8px;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>
  <!-- Оновлений блок із текстом та іконкою -->
  <div id="rotate-overlay">
    <div>Please turn your device horizontally.</div>
    <div class="phone-icon"></div>

    <!-- "Add to Home Screen" hint. Only the variant matching the current
         mobile browser is shown (see .platform-* rules); hidden entirely on
         desktop and when already installed as a standalone PWA. -->
    <div class="install-hint">
      <div class="install-ios">
        <div class="install-title">Install this app for the best experience:</div>
        <div class="install-steps">
          <span>Tap</span>
          <span class="ios-share-icon" aria-hidden="true"><span class="arrow-head"></span></span>
          <span>then</span>
          <span class="add-home-icon" aria-hidden="true"></span>
          <span>Add to Home Screen</span>
        </div>
      </div>

      <div class="install-android">
        <div class="install-title">Install this app for the best experience:</div>
        <div class="install-steps">
          <span>Tap</span>
          <span class="android-menu-icon" aria-hidden="true"></span>
          <span>then</span>
          <span class="add-home-icon" aria-hidden="true"></span>
          <span>Add to Home screen</span>
        </div>
      </div>
    </div>
  </div>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">TarotCards2</div>
    </div>
  </div>

  <script>
    // Tag <html> so CSS can show the correct install hint. iPadOS reports a
    // desktop UA, so also treat a touch-capable "MacIntel" as iOS.
    (function detectPlatform() {
      var root = document.documentElement;
      var ua = navigator.userAgent || "";
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var isStandalone =
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
        window.navigator.standalone === true;

      if (isIOS) root.classList.add("platform-ios");
      else if (isAndroid) root.classList.add("platform-android");
      if (isStandalone) root.classList.add("standalone");
    })();

    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build_7.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Build_7.data",
      frameworkUrl: buildUrl + "/Build_7.framework.js",
      codeUrl: buildUrl + "/Build_7.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "TarotCards2",
      productVersion: "0.1",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);

    // Fix #1: show/hide only the overlay, never the Unity container.
    // Removing the canvas from layout (display:none) makes Unity initialize
    // against a zero-sized canvas, which corrupts the touch->screen mapping
    // (adjustedY *= canvas.height / rect.height) and offsets every tap after
    // rotation. The overlay already covers the screen (z-index:9999), so the
    // canvas can stay laid out behind it.
    function handleOrientation() {
      const overlay = document.getElementById("rotate-overlay");
      const isPortrait = window.innerHeight > window.innerWidth;
      overlay.style.display = isPortrait ? "flex" : "none";
    }

    // Fix #2: force iOS (especially an installed standalone PWA) to recompute
    // the canvas geometry after the rotation has actually settled, then tell
    // Unity to re-read the canvas size and rebuild its framebuffer. Without
    // this, getBoundingClientRect()/canvas size stay stale from the portrait
    // launch state and touches land offset downward in landscape.
    function refreshUnityViewport() {
      window.scrollTo(0, 0);
      // Force a synchronous reflow so the next rect read is fresh.
      void document.getElementById("unity-container").offsetHeight;
      // Nudge Unity's own resize handler to re-sync the WebGL render target.
      window.dispatchEvent(new Event("resize"));
    }

    function onOrientationChange() {
      handleOrientation();
      // iOS reports stale innerWidth/innerHeight and rects immediately after
      // the event fires, so re-sync a few times as the animation completes.
      [50, 250, 500, 800].forEach(function (t) {
        setTimeout(function () {
          handleOrientation();
          refreshUnityViewport();
        }, t);
      });
    }

    window.addEventListener("resize", handleOrientation);
    window.addEventListener("orientationchange", onOrientationChange);

    handleOrientation();
  </script>
</body>

</html>
