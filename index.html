<!DOCTYPE html>
<html lang="en-us">

<head>
<meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Ukrainian Night Tarot</title>

  <link rel="manifest" href="manifest.json?v=3">

  <meta name="theme-color" content="#000000">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ukrainian Night Tarot">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=6">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #unity-container {
      width: 100vw;
      height: 100vh;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Overlay when phone is vertical */
    #rotate-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      display: none;
      flex-direction: column;
      /* Змінено на column, щоб текст та іконка були один під одним */
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-size: 22px;
      /* Трохи зменшено, щоб гарантовано влазило на маленькі екрани */
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
      /* Виправляє обрізання тексту, враховуючи падінги всередині ширини */
      font-family: sans-serif;
    }

    /* Стилі для іконки телефону */
    .phone-icon {
      width: 40px;
      height: 70px;
      border: 3px solid white;
      border-radius: 6px;
      margin-top: 25px;
      /* Відступ під текстом */
      position: relative;
      animation: rotatePhone 2.5s ease-in-out infinite;
    }

    /* Кнопка "Home" або динамік на іконці телефону для реалістичності */
    .phone-icon::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border: 1px solid white;
      border-radius: 50%;
    }

    /* Анімація повороту екрана */
    @keyframes rotatePhone {

      0%,
      10% {
        transform: rotate(0deg);
      }

      40%,
      60% {
        transform: rotate(-90deg);
      }

      90%,
      100% {
        transform: rotate(0deg);
      }
    }
  </style>
</head>

<body>
  <!-- Оновлений блок із текстом та іконкою -->
  <div id="rotate-overlay">
    <div>Please turn your device horizontally.</div>
    <div class="phone-icon"></div>
  </div>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">TarotCards2</div>
    </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build_7.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Build_7.data",
      frameworkUrl: buildUrl + "/Build_7.framework.js",
      codeUrl: buildUrl + "/Build_7.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "TarotCards2",
      productVersion: "0.1",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);

    function handleOrientation() {
      const overlay = document.getElementById("rotate-overlay");

      if (window.innerHeight > window.innerWidth) {
        overlay.style.display = "flex";
        document.getElementById("unity-container").style.display = "none";
      } else {
        overlay.style.display = "none";
        document.getElementById("unity-container").style.display = "block";
      }
    }

    window.addEventListener("resize", handleOrientation);
    window.addEventListener("orientationchange", handleOrientation);

    handleOrientation();
  </script>
</body>

</html>
