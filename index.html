<!DOCTYPE html>
<html lang="en-us">

<head>
<meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Ukrainian Night Tarot</title>

  <link rel="manifest" href="manifest.json?v=3">

  <meta name="theme-color" content="#000000">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ukrainian Night Tarot">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=6">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    /* Size is driven from JS (see applyViewportSize) using visualViewport,
       because 100vh/% are unreliable in iOS standalone PWAs across
       orientation changes and cause a touch-vs-render offset. These are
       only fallbacks before the first JS pass runs. */
    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Overlay when phone is vertical */
    #rotate-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      display: none;
      flex-direction: column;
      /* Змінено на column, щоб текст та іконка були один під одним */
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-size: 22px;
      /* Трохи зменшено, щоб гарантовано влазило на маленькі екрани */
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
      /* Виправляє обрізання тексту, враховуючи падінги всередині ширини */
      font-family: sans-serif;
    }

    /* Стилі для іконки телефону */
    .phone-icon {
      width: 40px;
      height: 70px;
      border: 3px solid white;
      border-radius: 6px;
      margin-top: 25px;
      /* Відступ під текстом */
      position: relative;
      animation: rotatePhone 2.5s ease-in-out infinite;
    }

    /* Кнопка "Home" або динамік на іконці телефону для реалістичності */
    .phone-icon::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border: 1px solid white;
      border-radius: 50%;
    }

    /* Анімація повороту екрана */
    @keyframes rotatePhone {

      0%,
      10% {
        transform: rotate(0deg);
      }

      40%,
      60% {
        transform: rotate(-90deg);
      }

      90%,
      100% {
        transform: rotate(0deg);
      }
    }
  </style>
</head>

<body>
  <!-- Оновлений блок із текстом та іконкою -->
  <div id="rotate-overlay">
    <div>Please turn your device horizontally.</div>
    <div class="phone-icon"></div>
  </div>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">TarotCards2</div>
    </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var unityInstance = null;

    // === ROOT-CAUSE FIX =====================================================
    // Unity's WebGL runtime reports its screen/orientation size to the engine
    // from window.innerWidth/innerHeight (JS_ScreenOrientation_eventHandler in
    // Build_7.framework.js). It uses that value for Screen.height, which drives
    // the touch-Y flip into game space. It renders, however, into a canvas
    // sized from canvas.getBoundingClientRect() — a DIFFERENT source.
    //
    // In an installed standalone PWA on iOS, window.innerHeight returns a
    // stale/incorrect value after an orientation change (it does not self-
    // correct), while the CSS layout viewport (documentElement.clientHeight)
    // updates correctly. Result: the scene renders in the right place but every
    // touch is flipped using the wrong height -> a constant downward offset.
    // (In a normal browser tab innerHeight is correct, so it only breaks in the
    // installed PWA, and only after rotating.)
    //
    // Force innerWidth/innerHeight to track the layout viewport so the value
    // Unity consumes matches the canvas it actually renders into. Must run
    // before the Unity loader executes.
    (function alignViewportMetricsForPWA() {
      function layoutW() { return document.documentElement.clientWidth || window.screen.width; }
      function layoutH() { return document.documentElement.clientHeight || window.screen.height; }
      try {
        Object.defineProperty(window, "innerWidth", { configurable: true, get: layoutW });
        Object.defineProperty(window, "innerHeight", { configurable: true, get: layoutH });
      } catch (e) {
        // Some engines mark these non-configurable; the resize re-dispatch
        // below is the fallback and is harmless if the override took.
        console.warn("Could not override innerWidth/innerHeight:", e);
      }
    })();

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build_7.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Build_7.data",
      frameworkUrl: buildUrl + "/Build_7.framework.js",
      codeUrl: buildUrl + "/Build_7.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "TarotCards2",
      productVersion: "0.1",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((instance) => {
        unityInstance = instance;
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
        // Re-measure once the engine is live so the drawing buffer matches
        // the visible viewport from the very first frame.
        scheduleResize();
      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);

    // --- Viewport sizing --------------------------------------------------
    // Secondary consistency measure supporting the innerWidth/innerHeight fix
    // at the top of this script: size the canvas explicitly to the layout
    // viewport (in px, overriding the TemplateData 100%/vh rules) so the canvas
    // render box matches the Screen size Unity now reads. Also re-dispatch
    // "resize" after the viewport settles so Unity re-reads the corrected size
    // once the post-rotation layout is final.
    // Guards against re-entrancy: applyViewportSize() dispatches a synthetic
    // "resize" (Unity 6 listens to window "resize" to re-sync its canvas), but
    // our own handleOrientation also listens to "resize" — without this flag
    // the two would recurse infinitely.
    var suppressResizeHandler = false;

    // Single source of truth for size: the layout viewport. This is the same
    // value we now feed Unity via the innerWidth/innerHeight override above, so
    // the canvas box and Unity's internal Screen size stay identical -> no
    // input offset. (documentElement.client* updates correctly on iOS
    // standalone rotation, unlike the native window.innerHeight.)
    function getViewportSize() {
      var el = document.documentElement;
      return {
        w: Math.round(el.clientWidth || window.screen.width),
        h: Math.round(el.clientHeight || window.screen.height)
      };
    }

    function applyViewportSize() {
      var size = getViewportSize();
      var container = document.getElementById("unity-container");
      // Inline px styles win over the TemplateData stylesheet's 100%/vh rules.
      container.style.width = size.w + "px";
      container.style.height = size.h + "px";
      canvas.style.width = size.w + "px";
      canvas.style.height = size.h + "px";
      // Nudge Unity to re-read its canvas rect / drawing buffer. Unity 6
      // re-syncs the canvas on the window "resize" event.
      suppressResizeHandler = true;
      window.dispatchEvent(new Event("resize"));
      suppressResizeHandler = false;
    }

    // orientationchange/resize fire BEFORE the browser finishes updating the
    // viewport dimensions, so a single synchronous read gets stale values.
    // Re-apply across a few frames and a short deferred pass so we settle on
    // the correct post-rotation size.
    function scheduleResize() {
      applyViewportSize();
      requestAnimationFrame(applyViewportSize);
      requestAnimationFrame(function () { requestAnimationFrame(applyViewportSize); });
      setTimeout(applyViewportSize, 250);
      setTimeout(applyViewportSize, 500);
    }

    function handleOrientation() {
      var overlay = document.getElementById("rotate-overlay");
      var size = getViewportSize();
      // Overlay (z-index 9999) covers the canvas in portrait. We do NOT hide
      // the container with display:none anymore — a hidden canvas has a zero
      // bounding rect, which is what corrupted the coordinate mapping when
      // the PWA booted in portrait and was then rotated to landscape.
      overlay.style.display = size.h > size.w ? "flex" : "none";
      scheduleResize();
    }

    function onWindowResize() {
      if (suppressResizeHandler) return; // ignore our own synthetic resize
      handleOrientation();
    }

    window.addEventListener("resize", onWindowResize);
    window.addEventListener("orientationchange", handleOrientation);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", function () {
        if (suppressResizeHandler) return;
        scheduleResize();
      });
    }

    applyViewportSize();
    handleOrientation();
  </script>
</body>

</html>
